services:
  controller:
    build:
      context: ./controller-go
    command:
      - "--udp"
      - ":9000"
      - "--http"
      - ":8080"
      - "--metrics"
      - ":9090"
      - "--offline-after"
      - "5s"
      - "--alert-consecutive"
      - "3"
      - "--max-ingest-per-sec"
      - "200"
      - "--hmac-secret"
      - "demo-secret"
      - "--history-dir"
      - "/app/history"
      - "--history-retention"
      - "10m"
      - "--static-dir"
      - ""
    ports:
      - "9000:9000/udp"
      - "8080:8080"
      - "9090:9090"
    volumes:
      - controller-history:/app/history
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  dashboard:
    build:
      context: ./web-dashboard
      args:
        CONTROLLER_ORIGIN: http://controller:8080
    ports:
      - "5173:80"
    depends_on:
      - controller
    restart: unless-stopped

  agent:
    build:
      context: ./agent-go
    command:
      - "--controller"
      - "controller:9000"
      - "--device"
      - "sw-01"
      - "--ifaces"
      - "eth0"
      - "--period"
      - "1s"
      - "--source"
      - "sysfs"
      - "--secret"
      - "demo-secret"
    depends_on:
      - controller
    restart: unless-stopped

volumes:
  controller-history:
